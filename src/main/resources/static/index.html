<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claims dashboard</title>
<style>body{font:16px system-ui;max-width:900px;margin:2rem auto;padding:0 1rem}button,input,select,textarea{font:inherit;margin:.3rem;padding:.3rem}textarea{width:95%}article{border:1px solid #aaa;padding:1rem;margin:1rem 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{cursor:pointer}</style>
<h1>Claims dashboard</h1><div id="login"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="signIn()">Sign in</button></div>
<div id="app" hidden><p id="who"></p><button onclick="refresh()">Refresh</button><button onclick="signOut()">Sign out</button><h2>Notices</h2><div id="notices"></div><div id="new"></div><div id="summary"></div><h2>Claims</h2><div id="filters"></div><div id="claims"></div><div id="detail"></div></div><p id="error" role="alert"></p>
<script>
let csrf,account,selected,noticeTimer,noticeBusy=false,noticeGeneration=0;
const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function signedOut(){clearInterval(noticeTimer);noticeTimer=undefined;noticeGeneration++;noticeBusy=false;account=null;selected=null;$('app').hidden=true;$('login').hidden=false;$('detail').innerHTML='';$('notices').innerHTML=''}
function showNotices(items){$('notices').innerHTML=items.map(n=>`<p>${escape(n.type)}: <button onclick="openClaim('${n.claimId}')">${escape(n.claimReference)}</button></p>`).join('')||'No delivered notices'}
async function pollNotices(){if(!account||noticeBusy)return;noticeBusy=true;let generation=noticeGeneration;try{let items=(await api('/notifications?limit=100')).items;if(account&&generation===noticeGeneration)showNotices(items)}catch(e){}finally{if(generation===noticeGeneration)noticeBusy=false}}
function startNotices(){if(account&&!noticeTimer)noticeTimer=setInterval(pollNotices,5000)}
async function api(path,method='GET',data,key){let r=await fetch('/api'+path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf,'Idempotency-Key':key||crypto.randomUUID()},body:data===undefined?undefined:JSON.stringify(data)});let v=r.status===204?{}:await r.json();if(!r.ok){let code=v.error?.code||r.status;if(code==='AUTH_REQUIRED'&&account)signedOut();throw Error(code)}return v}
async function run(fn){try{$('error').textContent='';await fn()}catch(e){$('error').textContent=e.message}}
async function signIn(){await run(async()=>{csrf=(await api('/csrf')).csrfToken;let v=await api('/session','POST',{email:$('email').value,password:$('password').value});csrf=v.csrfToken;account=v.account;$('password').value='';startNotices();await refresh()})}
async function signOut(){await run(async()=>{await api('/session','DELETE');signedOut()})}
async function refresh(){await run(async()=>{let v=await api('/session');account=v.account;csrf=v.csrfToken;$('login').hidden=true;$('app').hidden=false;$('who').textContent=account.email+' · '+(account.market?account.market.code+' / '+account.market.currency:'Officer team '+account.teamId);await pollNotices();if(!account)return;
if(account.role==='CLAIMANT'){$('filters').innerHTML='';$('summary').innerHTML='';$('new').innerHTML=`<h2>Report incident</h2><p>${escape(account.market.code)} / ${escape(account.market.currency)}</p><select id="type"><option>MOTOR</option><option>PROPERTY</option></select><input id="date" type="date"><input id="location" placeholder="Location"><input id="asset" placeholder="Affected asset"><textarea id="description" placeholder="What happened?"></textarea><input id="policy" placeholder="Policy reference (optional)"><input id="requested" placeholder="Requested amount (optional)"><button onclick="report()">Report</button>`;$('date').value=new Date().toISOString().slice(0,10)}else{$('new').innerHTML='';$('filters').innerHTML=['unassigned','mine','waiting','team'].map(f=>`<button onclick="list('${f}')">${f}</button>`).join('');let s=await api('/officer/team/summary?from=2020-01-01T00:00:00Z&to=2100-01-01T00:00:00Z');$('summary').innerHTML=`<h2>Team measures</h2><p>Open ${s.openCount} · Decided ${s.decidedCount} · Resolved ${s.resolvedCount} · Period decisions ${s.decisionCount} · Mean seconds ${s.meanTimeToDecisionSeconds??'—'}</p>`+s.exposureByCurrency.map(x=>`<p>${escape(x.currency)}: known ${escape(x.knownOutstandingTotal)}; unknown claims ${x.unknownClaimCount}; total claims ${x.claimCount}${x.incomplete?' (incomplete)':''}</p>`).join('')}
await list(account.role==='CLAIMANT'?null:'unassigned');if(selected)await openClaim(selected);startNotices()})}
async function list(view){await run(async()=>{let v=await api(view?'/officer/claims?view='+view+'&limit=100':'/claims?limit=100');$('claims').innerHTML=v.items.map(c=>`<article><button onclick="openClaim('${c.id}')">${escape(c.reference)}</button> ${escape(c.type)} · ${escape(c.market)} / ${escape(c.currency)} · ${escape(c.status)} · next ${escape(c.nextActor)}</article>`).join('')||'No claims'})}
async function openClaim(id){await run(async()=>{selected=id;let c=(await api('/claims/'+id)).claim;let history=(await api('/claims/'+id+'/activity?limit=100')).items;let actions='';if(account.role==='OFFICER'){
if(!c.assignedOfficerId&&c.status!=='REJECTED'&&c.payment?.status!=='PAID')actions+='<button onclick="action(\'pickup\',{})">Pick up</button>';
if(c.assignedOfficerId===account.id){if(c.status!=='REJECTED'&&c.payment?.status!=='PAID')actions+='<button onclick="action(\'release\',{reason:prompt(\'Release reason (optional before substantive work)\')})">Release</button>';
if(!c.decision){actions+='<button onclick="action(\'information-requests\',{question:prompt(\'Question for claimant\')})">Request information</button><button onclick="assess()">Assess</button><button onclick="decide(\'SETTLED\')">Settle</button><button onclick="decide(\'REJECTED\')">Reject</button>';
for(let r of c.informationRequests.filter(r=>r.status==='OPEN'))actions+=`<button onclick="action('information-requests/${r.id}/withdraw',{reason:prompt('Withdrawal reason')})">Withdraw request</button>`}
if(c.payment?.status==='UNPAID')actions+='<button onclick="action(\'mark-paid\',{})">Confirm external payment</button>'}}
else for(let r of c.informationRequests.filter(r=>r.status==='OPEN'))actions+=`<button onclick="answer('${r.id}')">Answer request</button>`;
$('detail').innerHTML=`<h2>${escape(c.reference)}</h2><p>${escape(c.status)} · next ${escape(c.nextActor)} · ${escape(c.market)} / ${escape(c.currency)}</p><p>Incident: ${escape(c.incident.date)} · ${escape(c.incident.location)} · ${escape(c.incident.description)} · ${escape(c.incident.affectedAsset)}</p><p>Policy: ${escape(c.policyReference||'not provided')} · Requested: ${escape(c.requestedAmount||'not provided')}</p><p>Decision: ${escape(c.decision?JSON.stringify(c.decision):'pending')} · Payment: ${escape(c.payment?JSON.stringify(c.payment):'not applicable')}</p>${account.role==='OFFICER'?`<p>Assessment: ${escape(JSON.stringify(c.assessment))} · Exposure: ${escape(JSON.stringify(c.exposure))}</p>`:''}<h3>Requests</h3>${c.informationRequests.map(r=>`<p>${escape(r.question)} · ${escape(r.status)} · ${escape(r.answer||'')}</p>`).join('')}${actions}<h3>Progress</h3>${history.map(h=>`<p>${escape(h.type)} · ${escape(h.occurredAt)} · ${escape(h.message||JSON.stringify(h.details))}</p>`).join('')}`})}
async function report(){await run(async()=>{let body={type:$('type').value,incident:{date:$('date').value,location:$('location').value,description:$('description').value,affectedAsset:$('asset').value},policyReference:$('policy').value||null,requestedAmount:$('requested').value||null};let v=await api('/claims','POST',body);selected=v.claim.id;await refresh()})}
async function action(op,data){if(Object.values(data).some(x=>x===null)&&op.includes('withdraw'))return;await run(async()=>{let keyed=['information-requests','decision'].includes(op)||op.endsWith('/answer');await api('/claims/'+selected+'/'+op,'POST',data,keyed?crypto.randomUUID():undefined);await refresh()})}
async function answer(id){let answer=prompt('Answer');if(!answer)return;let policy=prompt('Policy reference (leave blank to keep current)');let amount=prompt('Requested amount (leave blank to keep current)');let data={answer};if(policy)data.policyReference=policy;if(amount)data.requestedAmount=amount;await action('information-requests/'+id+'/answer',data)}
async function assess(){let c=(await api('/claims/'+selected)).claim;let coverage=prompt('Coverage: UNKNOWN, APPEARS_COVERED, APPEARS_NOT_COVERED',c.assessment.coverage);if(!coverage)return;let reason=coverage==='UNKNOWN'?null:prompt('Coverage reason',c.assessment.reason||'');let loss=prompt('Assessed loss (blank = unknown)',c.assessment.assessedLoss||'');let estimate=prompt('Estimated unpaid (blank = unknown)',c.assessment.estimatedUnpaidAmount||'');await run(async()=>{await api('/claims/'+selected+'/assessment','PUT',{coverage,reason,assessedLoss:loss||null,estimatedUnpaidAmount:estimate||null});await refresh()})}
async function decide(kind){let c=(await api('/claims/'+selected)).claim;let amount=kind==='SETTLED'?prompt('Settlement amount'):null;if(kind==='SETTLED'&&!amount)return;let reason=prompt('Decision explanation');if(!reason)return;await action('decision',{kind,amount,reason,reviewedVersion:c.version})}
run(async()=>{csrf=(await api('/csrf')).csrfToken;await refresh();if(!account)$('error').textContent=''});
</script></html>
